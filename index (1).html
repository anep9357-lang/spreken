var BASE="Você é professor de holandês de uma brasileira com TDAH, nível A1 (basisexamen inburgering buitenland, parte Spreken). Na prova, o conteúdo vale 1 ponto se a resposta responde à pergunta ou completa a frase de forma lógica e compreensível; respostas curtas valem. A resposta dela pode vir de ditado do celular, então erros de transcrição são possíveis. Avalie como um examinador A1 gentil; erros pequenos de gramática não reprovam, mas a palavra deve encaixar na frase (tipo de palavra, de/het, ordem do verbo). ";

  var r=await smp(p,{modelTier:"quick",cache:false});return parseJSON(r.text)
}
async function askAA(smp,d,a){
  var p=BASE+'Tipo: completar frase com imagem (emojis que representam a imagem: '+d.p+'). Contexto: "'+(d.c||"")+'". Começo da frase: "'+d.s+' …". Ela disse só o final: "'+a+'". Responda SOMENTE com JSON válido, sem texto fora dele: {'+FMT+',"corrigida":"a frase completa correta em holandês, com o final dela corrigido se preciso","porque":"no máximo 2 frases curtas em português do Brasil: se encaixa ou não, e por quê (tipo de palavra, de/het, verbo no fim)","dica":"uma dica curta em português ou string vazia"}. Se o final dela completar a frase de forma lógica e correta, mesmo diferente do esperado, nivel é "boa".';
  var r=await smp(p,{modelTier:"quick",cache:false});return parseJSON(r.text)
}
async function askBatch(smp,pairs){
  var list=pairs.map(function(x,i){return(i+1)+". ["+(x.k==="va"?"pergunta":"completar frase")+'] "'+x.q+'" | Resposta dela: "'+x.a+'"'}).join("\n");
  var p=BASE+"Avalie cada item abaixo. Nos itens «completar frase», ela disse só o final da frase.\n"+list+'\nResponda SOMENTE com um array JSON válido com um objeto por item, na mesma ordem: [{'+FMT+',"corrigida":"resposta ou frase completa correta em holandês A1","porque":"1 frase curta em português do Brasil"}]';
  var r=await smp(p,{modelTier:"quick",cache:false});return parseJSON(r.text,true)
}
function lvl(x){return["boa","quase","refazer"].indexOf(x)>=0?x:"quase"}

/* ---------- local checks ---------- */
function localVA(d,a){
  var n=norm(a),words=n.split(" ").filter(Boolean),checks=[];
  checks.push({ok:words.length>=3,t:words.length>=3?"Frase completa":"Tente uma frase completa: quem + verbo + informação."});
  var m=MUST[d.w];
  if(m){var ok=m[0].test(n);checks.push({ok:ok,t:ok?"Respondeu ao tipo de pergunta":m[1]})}
  return{ok:checks.every(function(c){return c.ok}),checks:checks};
}
function matchAA(d,a){
  if(!d.a||!d.a.length)return false;
  var n=norm(a);
  return d.a.some(function(x){
    if(x==="#num")return /(\w*tig\b|\b\d+\b)/.test(n);
    return new RegExp("(^| )"+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"( |$)").test(n);
  });
}

/* ---------- sessions ---------- */
function startSession(mode){
  var items=[];
  if(mode==="mix"){var v=pick(VA,3),a=pick(AA,2);items=[wrapVA(v[0]),wrapAA(a[0]),wrapVA(v[1]),wrapAA(a[1]),wrapVA(v[2])]}
  else if(mode==="fala"){
    var du=shuffle(dueList()).slice(0,7),fr=freshList(),nf=Math.max(3,10-du.length);
    var all=du.concat(fr.slice(0,nf));
    if(!all.length)all=pick(allItems(),8);
    items=shuffle(all.slice(0,10)).map(wrapAny);
    if(!items.length){toast("Nada para treinar");return}
  }
  else if(mode.indexOf("L:")===0){var LL=lessonById(mode.slice(2));items=shuffle(LL.pool()).slice(0,6).map(wrapAny);if(!items.length){toast("Sem itens nesta aula");return}}
  else if(mode==="va")items=pick(official().va,5).map(wrapVA);
  else if(mode==="aa")items=pick(official().aa,5).map(wrapAA);
  else if(mode==="sim")items=shuffle(official().va).slice(0,10).map(wrapVA).concat(shuffle(official().aa).slice(0,12).map(wrapAA));
  else if(mode==="rev"){var w=shuffle(weak()).slice(0,8);if(!w.length){toast("Ainda não há erros para revisar");return}items=w.map(wrapAny)}
  else if(mode==="mine"){var c=buildCustom();if(!c.length){toast("Cole seus itens na aba Meus itens");return}items=shuffle(c).slice(0,8).map(wrapAny)}
  (function(){var seen={};items=items.filter(function(x){var k=normQ(x.d);if(seen[k])return false;seen[k]=1;return true})})();
  S.sess={mode:mode,items:items,i:0,step:"ask",draft:"",ans:[],res:[],busy:false,note:"",batch:false,tok:1,played:0,rate:null,live:store.simLive!==false};
  S.view="session";render();window.scrollTo(0,0);
}
function nextItem(){
  var s=S.sess;s.i++;s.step="ask";s.draft="";s.note="";s.tok++;s.heard="";s.an=null;s.micErr="";s.reps=0;
  if(s.i>=s.items.length)finish();
  render();window.scrollTo(0,0);
}
function finish(){
  var s=S.sess;
  if(s.mode==="sim"){
    s.items.forEach(function(it,i){
      if(s.res[i])return;
      var a=s.ans[i];
      if(!a){s.res[i]={level:"refazer",fixed:falaAnswer(it),ans:"",local:true};record(it.d.id,false);return}
      var ok=it.k==="aa"?matchAA(it.d,a):localVA(it.d,a).ok;
      s.res[i]={level:ok?"boa":"quase",fixed:falaAnswer(it),ans:a,local:true};record(it.d.id,ok);
    });
  }
  if(s.mode.indexOf("L:")===0){store.les[s.mode.slice(2)]=Date.now();save()}
  S.view="summary";
}
function applyAI(r,ai,d,a){
  r.level=lvl(ai.nivel);r.fixed=ai.corrigida||(d.nl!==undefined?fill(d.m):fullAA(d))||a;r.why=ai.porque||"";r.tip=ai.dica||"";r.ai=true;
}
async function checkVA(skip){
  var s=S.sess,it=cur(),d=it.d,a=s.draft.trim();
  if(!skip&&!a){toast("Escreva ou dite algo primeiro");return}
  if(s.mode==="sim"){s.ans[s.i]=skip?"":a;nextItem();return}
  s.busy=true;s.note="";render();
  var loc=skip?null:localVA(d,a),ai=null,r={ans:a,loc:loc,skip:!!skip};
  if(!skip){
    var smp=await getSample();
    if(smp){try{ai=await askVA(smp,d,a)}catch(e){s.note=e&&e.code==="not_granted"?"O Claude não está liberado nesta página. Mostrei só a checagem simples.":"A correção do Claude não respondeu agora. Mostrei só a checagem simples."}}
    else s.note="A correção do Claude não está disponível aqui. Mostrei só a checagem simples.";
  }
  if(skip){r.level="refazer";r.fixed=fill(d.m);r.why="Sem problema. Ouça a resposta-modelo e repita em voz alta."}
  else if(ai)applyAI(r,ai,d,a);
  else{r.level=loc.ok?"boa":"quase";r.fixed=loc.ok?a:(fill(d.m)||a)}
  s.res[s.i]=r;record(d.id,r.level==="boa");
  s.busy=false;s.step="res";render();
}
async function checkAA(skip){
  var s=S.sess,d=cur().d,a=s.draft.trim();
  if(!skip&&!a){toast("Escreva ou dite o final da frase");return}
  if(s.mode==="sim"){s.ans[s.i]=skip?"":a;nextItem();return}
  var r={ans:a,skip:!!skip};s.res[s.i]=r;s.note="";
  if(skip){r.level="refazer";r.fixed=fullAA(d)||"";r.why="Sem problema. Ouça a frase completa e repita em voz alta.";record(d.id,false);s.step="res";render();return}
  if(matchAA(d,a)){r.level="boa";r.fixed=fullAA(d);r.quick=true;record(d.id,true);s.step="res";render();return}
  s.busy=true;render();
  var smp=await getSample(),ai=null;
  if(smp){try{ai=await askAA(smp,d,a)}catch(e){s.note=e&&e.code==="not_granted"?"O Claude não está liberado nesta página.":"A correção do Claude não respondeu agora."}}
  else s.note="A correção do Claude não está disponível aqui.";
  if(ai){applyAI(r,ai,d,a);record(d.id,r.level==="boa")}
  else{r.pending=true;r.fixed=fullAA(d)||((d.c?d.c+" ":"")+d.s+" "+a+".")}
  s.busy=false;s.step="res";render();
}
function selfGrade(ok){
  var s=S.sess,r=s.res[s.i],d=cur().d;
  r.pending=false;r.level=ok?"boa":"refazer";record(d.id,ok);render();
}
async function batchCorrect(){
  var s=S.sess,smp=await getSample();
  if(!smp){toast("O Claude não está disponível aqui");return}
  var idx=[],pairs=[];
  s.items.forEach(function(it,i){
    if((s.res[i]&&!s.res[i].local)||!s.ans[i])return;
    idx.push(i);pairs.push({k:it.k,q:it.k==="va"?it.d.nl:((it.d.c?it.d.c+" ":"")+it.d.s+" …"),a:s.ans[i]});
  });
  if(!pairs.length){s.batch=true;render();return}
  s.busy=true;render();
  try{
    var out=await askBatch(smp,pairs);
    idx.forEach(function(i,n){
      var o=out[n]||{},it=s.items[i],lv=lvl(o.nivel);
      s.res[i]={level:lv,fixed:o.corrigida||(it.k==="va"?fill(it.d.m):fullAA(it.d)),why:o.porque||"",ans:s.ans[i]};
      record(it.d.id,lv==="boa");
    });
    s.batch=true;
  }catch(e){toast("O Claude não respondeu agora")}
  s.busy=false;render();
}

function startListen(){
  var s=S.sess;
  try{speechSynthesis.cancel()}catch(e){}
  if(!SR){S.micBad=true;s.micErr="nosr";render();return}
  var done=false,text="",confs=[];
  try{
    rec=new SR();rec.lang="nl-NL";rec.interimResults=true;rec.maxAlternatives=1;rec.continuous=false;
    rec.onresult=function(e){
      text="";confs=[];
      for(var i=0;i<e.results.length;i++){text+=e.results[i][0].transcript+" ";if(e.results[i].isFinal&&e.results[i][0].confidence)confs.push(e.results[i][0].confidence)}

    };
    rec.onerror=function(e){
      if(done)return;done=true;s.listen=false;
      if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture")S.micBad=true;
      s.micErr=e.error;S.lastErr=e.error;render();
    };
    rec.onend=function(){
      if(done)return;done=true;s.listen=false;
      text=text.trim();
      if(!text){s.micErr="empty";render();return}
      finishListen(text,confs.length?confs.reduce(function(a,b){return a+b},0)/confs.length:null);

function offTopic(it,an){
  if(!an||an.nomodel||an.exact)return false;
  if(it.k==="aa"&&it.d.official)return false;

function analyze(it,heard){
  var d=it.d,H=norm(heard).split(" ").filter(Boolean),ok,target;
  var mm=store.mm[d.id];
  if(it.k==="aa"){target=d.m||(mm&&mm.m)||"";ok=matchAA(d,heard)}
  else{target=fill(d.m)||(mm&&mm.m)||"";ok=localVA(d,heard).ok}
  var Tw=norm(target).split(" ").filter(Boolean),n=Tw.length,m=H.length,L=[],i,j;
  if(!n)return{words:[],ok:true,all:false,nomodel:true,heard:H};
  for(i=0;i<=n;i++){L[i]=[];for(j=0;j<=m;j++)L[i][j]=0}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)L[i][j]=Tw[i]===H[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  var hit=[],a=0,b=0;
  while(a<n&&b<m){if(Tw[a]===H[b]){hit[a]=true;a++;b++}else if(L[a+1][b]>=L[a][b+1])a++;else b++}
  var words=Tw.map(function(w,k){return{w:w,ok:!!hit[k]}});
  var all=words.length>0&&words.every(function(x){return x.ok});
  var cover=words.filter(function(x){return x.ok}).length/words.length;
  if(ok&&!all)words=H.map(function(w){return{w:w,ok:true}});
  return{words:words,ok:ok,all:all||ok,heard:H,cover:cover,exact:all};
}

  return shead()
  +'<div class="card"><div class="kw"><span class="chip">'+esc(t[0])+'</span><span class="ptw">= '+esc(t[1])+'</span></div><h2 class="nl">'+esc(d.nl)+'</h2>'
  +'<div class="row">'+sayBtn(d.nl)+(d.pt?'<button class="btn sm" data-act="tog" data-t="tr">Tradução</button>':'')+'<button class="btn sm" data-act="tog" data-t="hint">Dica</button></div>'
  +'<p class="box" id="tr" hidden>'+esc(d.pt)+'</p>'
  +'<p class="box" id="hint" hidden>'+(d.frame?'Comece assim: <b>'+esc(d.frame)+'</b><br>':'')+esc(t[1])+' → '+esc(t[2])+'</p></div>'
  +'<label for="ans">Diga em voz alta. Depois escreva ou dite aqui.</label>'
  +'<textarea id="ans" placeholder="Ik …" autocomplete="off" autocapitalize="sentences" spellcheck="false">'+esc(s.draft)+'</textarea>'
  +'<button class="btn pri" data-act="check"'+(s.busy?' disabled':'')+'>'+(s.busy?'Corrigindo…':(s.mode==="sim"?'Próxima':'Corrigir'))+'</button>'
  +'<button class="btn" data-act="skip"'+(s.busy?' disabled':'')+'>Não sei dizer</button>';
}
function vaResHTML(){
  var s=S.sess,d=cur().d,r=s.res[s.i];
  var lab={boa:"Muito bem!",quase:"Quase lá",refazer:"Vamos de novo, sem pressão"}[r.level];
  var chk=(!r.ai&&r.loc)?'<div class="box">'+r.loc.checks.map(function(c){return (c.ok?'✓ ':'• ')+esc(c.t)}).join('<br>')+'</div>':'';
  return shead()
  +'<div class="card"><span class="lv lv-'+r.level+'">'+lab+'</span>'
  +(r.ans?'<p class="yours">Você disse: «'+esc(r.ans)+'»</p>':'')
  +'<div class="fix"><span class="lab">'+(r.level==="boa"&&r.ai?'Perfeito assim':'Fica assim')+'</span><p class="nl">'+esc(r.fixed)+'</p>'+sayBtn(r.fixed,"Ouvir a frase")+'</div>'
  +(r.why?'<p>'+esc(r.why)+'</p>':'')
  +(r.tip?'<p class="box">💡 '+esc(r.tip)+'</p>':'')
  +chk
  +(s.note?'<p class="note">'+esc(s.note)+'</p>':'')
  +(d.m?'<p class="box"><span class="lab">Resposta-modelo</span><br>'+esc(fill(d.m))+'</p>':'')
  +repsHTML('Agora diga a frase certa em voz alta, 3 vezes.')+'</div>'
  +'<button class="btn pri" data-act="next">'+(s.i+1>=s.items.length?'Ver resumo':'Próxima')+'</button>';
}
function aaAskHTML(){
  var s=S.sess,d=cur().d,cat=CAT[d.cat];
  return shead()
  +'<div class="card"><span class="chip">Complete a frase</span><div class="pic" aria-hidden="true">'+esc(d.p)+'</div>'
  +(d.c?'<p class="ctx">'+esc(d.c)+'</p>':'')+'<p class="blank">'+esc(d.s)+' <u>&nbsp;</u></p>'
  +'<div class="row">'+sayBtn((d.c?d.c+" ":"")+d.s)+(d.pt?'<button class="btn sm" data-act="tog" data-t="tr">Tradução</button>':'')+'<button class="btn sm" data-act="tog" data-t="hint">Dica: o que falta?</button></div>'
  +'<p class="box" id="tr" hidden>'+esc(d.pt?d.pt.split(". ")[0]+".":"")+'</p>'
  +'<p class="box" id="hint" hidden>'+(cat?'<b>'+esc(cat[0])+'.</b> '+esc(cat[1])+'<br>'+esc(cat[2]):'Olhe as últimas palavras antes do «…»: elas dizem que tipo de palavra falta.')+'</p></div>'
  +'<label for="ans">Diga só o final da frase em voz alta (uma palavra ou grupo curto). Depois escreva ou dite.</label>'
  +'<textarea id="ans" rows="2" placeholder="…" autocomplete="off" spellcheck="false">'+esc(s.draft)+'</textarea>'
  +'<button class="btn pri" data-act="check"'+(s.busy?' disabled':'')+'>'+(s.busy?'Conferindo…':(s.mode==="sim"?'Próxima':'Conferir'))+'</button>'
  +'<button class="btn" data-act="skip"'+(s.busy?' disabled':'')+'>Não sei dizer</button>';
}
function aaResHTML(){
  var s=S.sess,d=cur().d,r=s.res[s.i],cat=CAT[d.cat];
  var lab=r.pending?"Confira você mesma":{boa:"Muito bem!",quase:"Quase lá",refazer:r.skip?"Sem problema":"Vamos de novo, sem pressão"}[r.level];
  var cls=r.pending?"pend":r.level;
  var others=(d.a||[]).filter(function(x){return x!=="#num"}).join(", ");
  return shead()
  +'<div class="card"><span class="lv lv-'+cls+'">'+lab+'</span>'
  +'<div class="pic" aria-hidden="true">'+esc(d.p)+'</div>'
  +(r.ans?'<p class="yours">Você disse: «'+esc(r.ans)+'»</p>':'')
  +(r.fixed?'<div class="fix"><span class="lab">Frase completa</span><p class="nl">'+esc(r.fixed)+'</p>'+sayBtn(r.fixed,"Ouvir a frase")+'</div>':'')
  +(r.why?'<p>'+esc(r.why)+'</p>':'')
  +(r.tip?'<p class="box">💡 '+esc(r.tip)+'</p>':'')
  +(r.pending?'<p class="box"><b>Sem o Claude aqui, você decide.</b> Sua resposta encaixa na frase e no tipo de palavra? Compare com os exemplos abaixo.</p><div class="row"><button class="btn" data-act="selfok">Encaixa, contar como certo</button><button class="btn" data-act="selfno">Não encaixa</button></div>':'')
  +(s.note&&r.pending?'<p class="note">'+esc(s.note)+'</p>':'')
  +(cat?'<p class="box"><b>Regra da última palavra · '+esc(cat[0])+'.</b> '+esc(cat[2])+'</p>':'')
  +(d.g?'<p class="box">'+esc(d.g)+'</p>':'')
  +(others?'<p class="box">Também servem: '+esc(others)+'</p>':(d.a&&d.a.length?'<p class="box">Qualquer número de dezenas serve: vijftig, zestig, zeventig…</p>':''))
  +(d.pt?'<p class="yours">'+esc(d.pt)+'</p>':'')
  +repsHTML(r.fixed?'Diga a frase completa em voz alta, 3 vezes.':'Diga o final certo em voz alta, 3 vezes.')+'</div>'
  +'<button class="btn pri" data-act="next">'+(s.i+1>=s.items.length?'Ver resumo':'Próxima')+'</button>';
}
function summaryHTML(){
  var s=S.sess,sim=s.mode==="sim"&&!s.live,good=0,total=0;
  var rows=s.items.map(function(it,i){
    var r=s.res[i],d=it.d,lv=r?r.level:"",q=it.k==="va"?d.nl:((d.c?d.c+" ":"")+d.s+" …");
    var ans=(r&&r.ans)||s.ans[i]||"",line=(r&&r.fixed)||falaAnswer(it);
    if(r){total++;if(r.level==="boa")good++}
    return '<div class="li"><span class="sd '+lv+'"></span><div style="min-width:0;flex:1"><p><b>'+esc(q)+'</b></p>'
    +((sim||ans)?'<small>Você: «'+esc(ans||"sem resposta")+'»</small>':'')
    +'<small>Resposta: '+esc(line)+'</small>'+(r&&r.why?'<small>'+esc(r.why)+'</small>':'')+'</div>'+sayBtn(line,"")+'</div>';
  }).join("");
  var msg=sim&&!s.batch?"Esta é só uma conferência rápida, que não sabe julgar respostas abertas. Toque no botão abaixo para o Claude corrigir de verdade.":(total&&good/total>=.8?"Muito bem. Só conta como bom o que o app entendeu certo.":total&&good/total>=.5?"Boa sessão. Repetir é o que fixa.":"Sessão feita. Errar aqui é o treino, e os erros entram na revisão.");
  var td=todayCount();
  return '<div class="card"><h2 class="nl">'+(total?(sim?(s.batch?'Conteúdo: ':'Conferência simples: '):'')+good+' de '+total+(sim?'':' bons'):'Sessão concluída')+'</h2><p>'+msg+'</p>'
  +(sim&&s.batch?'<p class="box">Cada item vale 1 ponto de conteúdo e 1 de pronúncia. Aqui só dá para estimar o conteúdo. A pronúncia treine no oefenexamen do DUO, com Starten, Stoppen e Luisteren.</p>':'')
  +(td>=15?'<p class="note">Você já treinou bastante hoje. Vale uma pausa, água e descanso.</p>':'')+'</div>'
  +(sim&&!s.batch?'<button class="btn pri" data-act="batch"'+(s.busy?' disabled':'')+'>'+(s.busy?'Corrigindo…':'Corrigir minhas respostas com o Claude')+'</button>':'')
  +'<div class="card">'+rows+'</div>'
  +(s.mode==="sim"?'<button class="btn pri" data-act="start" data-m="sim">Novo simulado</button>':'<button class="btn pri" data-act="start" data-m="'+s.mode+'">Mais 5</button>')
  +'<button class="btn" data-act="home">Voltar ao início</button>';
}

function render(){
  var h;
  if(S.view==="session"){
    var s=S.sess,it=cur();
    if(s.mode==="sim"&&!s.live)h=falaAskHTML();
    else if(true)h=s.step==="ask"?falaAskHTML():falaRevHTML();
    else h=it.k==="va"?(s.step==="ask"?vaAskHTML():vaResHTML()):(s.step==="ask"?aaAskHTML():aaResHTML());
  }else if(S.view==="summary"){h=summaryHTML()}
  else{h=headerHTML()+tabsHTML()+(S.view==="learn"?learnHTML():S.view==="me"?meHTML():S.view==="lessons"?lessonsHTML():S.view==="lesson"?lessonHTML():homeHTML())}
  $("#app").innerHTML=h;
  afterRender();
}
function afterRender(){
  var s=S.sess;
  if(S.view==="session"&&s&&s.step==="res"&&cur())ensureModel(cur());
  if(S.view!=="session"||!s||s.step!=="ask")return;
  var t=s.tok;
  setTimeout(function(){if(S.sess&&S.sess.tok===t&&S.sess.step==="ask"){var b=document.getElementById("spoke");if(b)b.disabled=false}},3000);
  if(s.played!==t){s.played=t;var it=cur(),d=it.d;say(it.k==="va"?d.nl:((d.c?d.c+" ":"")+d.s))}
}

/* ---------- events ---------- */
var acts={
  tab:function(b){S.view=b.dataset.v;render();window.scrollTo(0,0)},
  lesson:function(b){S.les=b.dataset.id;S.view="lesson";render();window.scrollTo(0,0)},
  start:function(b){startSession(b.dataset.m)},
  home:function(){S.view="home";render();window.scrollTo(0,0)},
  exit:function(){S.view="home";render();window.scrollTo(0,0)},
  say:function(b){say(b.dataset.say)},
  tog:function(b){var el=document.getElementById(b.dataset.t);if(el)el.hidden=!el.hidden},
  check:function(){var it=cur();if(it.k==="va")checkVA(false);else checkAA(false)},
  skip:function(){var it=cur();if(it.k==="va")checkVA(true);else checkAA(true)},
  next:function(){nextItem()},
  speed:function(b){store.rate=parseFloat(b.dataset.r);save();say("Waar woont u?");render()},
  simlive:function(b){store.simLive=b.dataset.v==="1";save();render()},
  listen:function(){startListen()},
  stoplisten:function(){stopListen()},
  again:function(){var q=S.sess;q.step="ask";q.heard="";q.an=null;q.micErr="";q.tok++;q.played=q.tok;render();startListen()},
  dictcheck:function(){
    var q=S.sess,t=(q.draft||"").trim();
    if(!t){toast("Fale no microfone do teclado primeiro");return}
    finishListen(t,null);
  },
  spoke:function(){var q=S.sess;if(q.mode==="sim"&&!q.live){q.ans[q.i]="";nextItem();return}q.step="res";q.dk=false;q.heard="";q.an=null;q.reps=0;render();window.scrollTo(0,0)},
  nodk:function(){var q=S.sess;if(q.mode==="sim"&&!q.live){q.ans[q.i]="";nextItem();return}q.step="res";q.dk=true;q.heard="";q.an=null;q.reps=0;render();window.scrollTo(0,0)},
  rate:function(b){
    var s=S.sess,it=cur(),lv=parseInt(b.dataset.lv,10);
    if(s.dk&&lv>0)lv=0;
    if(lv===2&&offTopic(it,s.an))lv=1;
    gradeSRS(it.d.id,lv);record(it.d.id,lv===2);
    s.res[s.i]={level:lv===2?"boa":lv===1?"quase":"refazer",fixed:falaAnswer(it),ans:s.heard||""};
    var n=(it.again||0);
    if(s.mode!=="sim"&&((lv===0&&n<2)||(lv===1&&n<1))){
      var c={k:it.k,d:it.d,again:n+1};
      var at=Math.min(s.items.length,s.i+4);
      s.items.splice(at,0,c);
    }
    toast(lv===2?"Boa! Volta em alguns dias.":lv===1?"Quase. Vai voltar já já.":"Sem drama. Vai voltar já já.");
    nextItem();
  },
  selfok:function(){selfGrade(true)},
  selfno:function(){selfGrade(false)},
  batch:function(){batchCorrect()},
  savecust:function(){
    var el=document.getElementById("cust");if(!el)return;
    store.custom=parseCustom(el.value);save();
    var sk=parseCustom.skipped||0;
    toast(store.custom.length?store.custom.length+" itens salvos"+(sk?" · "+sk+" linhas ignoradas (títulos ou frases sem «?» nem «…»)":""):"Lista vazia");render();
  },
  rep:function(b){
    b.classList.add("done");
    var all=document.querySelectorAll(".dot"),n=document.querySelectorAll(".dot.done").length,m=document.getElementById("repmsg");
    if(m)m.textContent=n>=all.length?"Isso! A boca aprende repetindo.":n+" de "+all.length;
    if(S.sess)S.sess.reps=n;
    if(S.sess&&n>=all.length){
      document.querySelectorAll("#rate button").forEach(function(x){x.disabled=false});
      var rh=document.getElementById("ratehint");if(rh)rh.textContent="";
    }
  }
};
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var f=acts[b.dataset.act];if(f)f(b);
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="ans"&&S.sess){S.sess.draft=t.value}
  else if(t.dataset&&t.dataset.pf){store.profile[t.dataset.pf]=t.value;save()}
});

render();
})();
</script>

</body></html>
